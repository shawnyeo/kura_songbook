<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>쿠라's 노래책</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&amp;family=Gowun+Dodum&amp;family=Noto+Sans+JP:wght@400;500;700&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./src/style.css?v=beta-1">
  </head>
  <body class="portal-page">
    <main class="portal-hero">
      <div class="portal-scene" aria-hidden="true">
        <span class="portal-scene-cup">🍵</span>
        <span class="portal-scene-jelly">🪼</span>
        <span class="portal-scene-petal">🌸</span>
      </div>

      <section class="portal-panel" aria-labelledby="portal-title">
        <p class="portal-eyebrow">Kura Songbook</p>
        <h1 id="portal-title">쿠라's 노래책</h1>
        <p class="portal-copy">노래 제목, 가수, 애니, OST 키워드로 쿠라의 노래를 찾아보세요.</p>

        <form class="portal-search" id="portal-search-form">
          <label class="search-label" for="portal-search-input">검색어</label>
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input
            id="portal-search-input"
            type="search"
            placeholder="예: 레몬, 발라드, OST"
            autocomplete="off"
          >
          <button type="submit">검색</button>
        </form>

        <div class="portal-chip-row" aria-label="빠른 탐색">
          <a href="./search.html?q=일본어">일본어</a>
          <a href="./search.html?q=발라드">발라드</a>
          <a href="./search.html?q=OST">OST</a>
          <a href="./search.html?q=그리움">그리움</a>
        </div>

        <div class="portal-actions">
          <button id="show-results-button" type="button">전체 곡 보기</button>
          <a href="./search.html">검색 결과 페이지로 이동</a>
        </div>
      </section>

      <aside class="portal-preview" aria-label="포털 안내">
        <article class="portal-preview-card">
          <p>🍀 오늘의 랜덤 추천</p>
          <h2>검색 페이지에서 바로 뽑기</h2>
          <a href="./search.html?random=1">랜덤 추천 열기</a>
        </article>
        <article class="portal-preview-card portal-preview-soft">
          <p>🔎 검색 도움말</p>
          <h2>여러 단어는 띄어쓰기</h2>
          <span>제목, 가수, 장르, 분위기를 함께 찾아요.</span>
        </article>
      </aside>
    </main>

    <script src="./src/portal.js?v=beta-1" defer></script>
  </body>
</html>
